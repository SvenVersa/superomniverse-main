<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIVERSE // Metahuman Classified</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="shared.js"></script>
</head>
<body>

    <!-- LOGIN / SIGN UP / GUEST -->
    <div id="login-screen" class="login-screen">
        <div class="login-wrap">
            <h1 class="login-logo">OMNIVERSE</h1>

            <section class="login-card">
                <div class="login-tabs">
                    <button type="button" id="tab-login" class="login-tab active" onclick="setAuthMode('login')">LOG IN</button>
                    <button type="button" id="tab-signup" class="login-tab" onclick="setAuthMode('signup')">SIGN UP</button>
                </div>

                <form id="auth-form" class="login-body" novalidate>
                    <input type="text" id="login-user" class="login-input" placeholder="Username" autocomplete="username" maxlength="50">
                    <input type="password" id="login-pass" class="login-input" placeholder="Password" autocomplete="current-password" maxlength="50">

                    <button type="submit" id="auth-submit" class="login-btn login-btn-primary">LOG IN</button>
                    <div id="login-error" class="login-error"></div>

                    <button type="button" class="login-btn login-btn-guest" onclick="loginAsGuest()">CONTINUE AS GUEST</button>
                </form>
            </section>
        </div>
    </div>

    <!-- MAIN APP WRAPPER (Hidden until login) -->
    <header class="comic-masthead">
        <div class="comic-corner-box">
            <span class="cc-price">OMNI</span>
            <span class="cc-code">APPROVED BY AUTHORITY</span>
            <span class="cc-issue">#001</span>
        </div>
        <div class="masthead-center">
            <div class="hero-subhead">THE ULTIMATE METAHUMAN ARCHIVE</div>
            <h1 class="comic-logo">OMNIVERSE</h1>
        </div>
        <div class="mode-toggles">
            <button id="view-mode-btn" class="comic-toggle-btn">📜 SWITCH TO CONTINUOUS STRIP</button>
        </div>
    </header>

    <div id="omni-nav-container"></div>

    <nav id="breadcrumb-trail" class="breadcrumb-bar hidden">
        <span class="crumb" onclick="renderPublishers()">MULTIVERSE HUB</span>
        <span class="crumb hidden" id="crumb-publisher"></span>
        <span class="crumb hidden" id="crumb-faction"></span>
    </nav>

    <section id="tactical-filters" class="comic-nav-deck hidden">
        <div class="search-bubble">
            <span style="font-family:'Bangers'; font-size:1.4rem; color:var(--comic-red);">SEARCH ARCHIVE:</span>
            <input type="text" id="search-input" placeholder="Enter Alias or Civilian Name...">
            <button class="action-btn" id="reset-btn">RESET COMIC</button>
        </div>
        
        <div class="squad-filters-container">
            <div class="filter-row">
                <button class="tab-btn active" data-key="ALL" data-val="ALL">FULL ROSTER</button>
                <button class="tab-btn" data-key="alignment" data-val="Hero">HEROES</button>
                <button class="tab-btn" data-key="alignment" data-val="Villain">VILLAINS</button>
                <button class="tab-btn" data-key="alignment" data-val="Anti-Hero">ANTI-HEROES</button>
            </div>
        </div>
    </section>

    <div class="arcade-ticker-wrap">
        <div class="ticker-label">COMIC TRIVIA ▶</div>
        <div class="ticker-text" id="arcade-ticker-text">INITIALIZING DATABANKS...</div>
    </div>

    <main class="comic-book-viewport">
        <div class="page-flipper hidden" id="page-flipper">
            <button class="flip-btn" id="prev-page" disabled>◀ PREV PAGE</button>
            <span class="page-indicator" id="page-indicator">PAGE 1 OF ?</span>
            <button class="flip-btn" id="next-page">NEXT PAGE ▶</button>
        </div>

        <section id="comic-stage" class="comic-page-sheet">
            <div class="narrative-box splash-load">
                LOADING MULTIVERSE DATA... PLEASE STAND BY.
            </div>
        </section>
    </main>

    <!-- DOSSIER MODAL -->
    <div id="detail-modal" class="modal hidden">
        <div class="modal-comic-frame">
            <button id="close-modal" class="close-comic-btn">X</button>
            <div id="modal-body">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body> 
</html>
