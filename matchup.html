<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIVERSE // Matchup Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="shared.js"></script>
</head>
<body>

    <header class="comic-masthead">
        <div class="comic-corner-box">
            <span class="cc-price">OMNI</span>
            <span class="cc-code">COMBAT SIMULATION UNIT</span>
            <span class="cc-issue">#VS</span>
        </div>
        <div class="masthead-center">
            <div class="hero-subhead">WHO WOULD WIN?</div>
            <h1 class="comic-logo" style="font-size: clamp(2.6rem, 6vw, 4.6rem);">MATCHUP SIMULATOR</h1>
        </div>
        <div class="mode-toggles"></div>
    </header>

    <div id="omni-nav-container"></div>

    <main class="comic-book-viewport">
        <section class="comic-page-sheet" id="matchup-stage">
            <div class="narrative-box splash-load">LOADING COMBATANT ROSTER...</div>
        </section>
    </main>

    <script src="matchup.js"></script>
</body>
</html>
